const STORAGE_KEY = "mcu-marathon-eps-v2"; // { [key]: "YYYY-MM-DD" }, key = id or "id:ep"
const LEGACY_KEY = "mcu-marathon-log-v1";  // { [id]: "YYYY-MM-DD" } from item-level version
const DEADLINE = new Date(2026, 11, 18, 23, 59, 59);

// Per-episode minutes: even split, last episode absorbs the remainder.
function epCount(item) { return item.epStart ? (item.epEnd - item.epStart + 1) : 0; }
function epMins(item, epNum) {
  const n = epCount(item);
  const base = Math.floor(item.mins / n);
  return (epNum === item.epEnd) ? item.mins - base * (n - 1) : base;
}
function epKey(item, epNum) { return item.id + ":" + epNum; }
function epLabel(item, epNum) { return "Ep " + epNum; }

// Every tickable unit: films/specials = 1 unit; TV = 1 unit per episode.
const UNITS = [];
ITEMS.forEach((item) => {
  if (item.epStart) {
    for (let e = item.epStart; e <= item.epEnd; e++) {
      UNITS.push({ key: epKey(item, e), mins: epMins(item, e), logTitle: item.title + " · Ep " + e });
    }
  } else {
    UNITS.push({ key: String(item.id), mins: item.mins, logTitle: item.title });
  }
});
const TOTAL_MINS = UNITS.reduce((s, u) => s + u.mins, 0);

let watched = {};
(function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { watched = JSON.parse(raw) || {}; return; }
  } catch (e) {}
  // migrate item-level ticks: mark every episode of a ticked season with the same date
  try {
    const raw = localStorage.getItem(LEGACY_KEY);
    if (raw) {
      const old = JSON.parse(raw) || {};
      ITEMS.forEach((item) => {
        const date = old[item.id];
        if (!date) return;
        if (item.epStart) {
          for (let e = item.epStart; e <= item.epEnd; e++) watched[epKey(item, e)] = date;
        } else {
          watched[String(item.id)] = date;
        }
      });
      persist();
    }
  } catch (e) {}
})();

function persist() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(watched)); } catch (e) {}
}

const fmtHours = (mins) => {
  const h = Math.floor(mins / 60);
  const m = Math.round(mins % 60);
  return h + "h " + String(m).padStart(2, "0") + "m";
};
const todayKey = () => {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
};
const fmtDate = (key) => {
  const p = key.split("-").map(Number);
  return new Date(p[0], p[1] - 1, p[2]).toLocaleDateString("en-GB", { day: "numeric", month: "short" });
};

const openItems = new Set();
let logOpen = false;

function itemDoneMins(item) {
  if (!item.epStart) return watched[item.id] ? item.mins : 0;
  let s = 0;
  for (let e = item.epStart; e <= item.epEnd; e++) if (watched[epKey(item, e)]) s += epMins(item, e);
  return s;
}
function itemDoneEps(item) {
  let c = 0;
  for (let e = item.epStart; e <= item.epEnd; e++) if (watched[epKey(item, e)]) c++;
  return c;
}

function buildList() {
  const ol = document.getElementById("list");
  ol.innerHTML = ITEMS.map((item, idx) => {
    let inner =
      '<div class="row">' +
      '<input type="checkbox" data-item="' + item.id + '" aria-label="Mark all of ' + item.title + '">' +
      '<span class="num display">' + (idx + 1) + "</span>" +
      '<span style="flex:1;min-width:0" data-open="' + item.id + '">' +
      '<span class="title">' + item.title + "</span>" +
      '<span class="meta"><span class="tag ' + item.type + '">' + item.type.toUpperCase() +
      '</span> · <span class="itemMeta"></span></span>' +
      "</span>";
    if (item.epStart) {
      inner += '<button class="expandBtn" data-open="' + item.id + '" aria-label="Show episodes">▾</button>';
    }
    inner += "</div>";
    if (item.epStart) {
      let eps = "";
      for (let e = item.epStart; e <= item.epEnd; e++) {
        eps +=
          '<li><label class="epRow" id="ep-' + item.id + "-" + e + '">' +
          '<input type="checkbox" data-ep="' + epKey(item, e) + '">' +
          '<span class="epName">' + epLabel(item, e) + "</span>" +
          '<span class="epMeta"><span class="epTime">' + fmtHours(epMins(item, e)) + '</span><span class="epWhen green"></span></span>' +
          "</label></li>";
      }
      inner += '<ul class="epList">' + eps + "</ul>";
    }
    return '<li id="item-' + item.id + '">' + inner + "</li>";
  }).join("");

  ol.addEventListener("change", (e) => {
    const epK = e.target.getAttribute("data-ep");
    const itemId = e.target.getAttribute("data-item");
    if (epK) {
      if (watched[epK]) delete watched[epK];
      else watched[epK] = todayKey();
    } else if (itemId) {
      const item = ITEMS.find((i) => String(i.id) === itemId);
      if (item.epStart) {
        const allDone = itemDoneEps(item) === epCount(item);
        for (let ep = item.epStart; ep <= item.epEnd; ep++) {
          const k = epKey(item, ep);
          if (allDone) delete watched[k];
          else if (!watched[k]) watched[k] = todayKey();
        }
      } else {
        if (watched[itemId]) delete watched[itemId];
        else watched[itemId] = todayKey();
      }
    } else return;
    persist();
    render();
  });

  ol.addEventListener("click", (e) => {
    const t = e.target.closest("[data-open]");
    if (!t) return;
    if (e.target.tagName === "INPUT") return;
    const id = Number(t.getAttribute("data-open"));
    const item = ITEMS.find((i) => i.id === id);
    if (!item || !item.epStart) return;
    e.preventDefault();
    if (openItems.has(id)) openItems.delete(id); else openItems.add(id);
    render();
  });
}

function render() {
  const doneMins = UNITS.reduce((s, u) => s + (watched[u.key] ? u.mins : 0), 0);
  const leftMins = TOTAL_MINS - doneMins;
  const pctDone = (doneMins / TOTAL_MINS) * 100;

  document.getElementById("pctLeft").innerHTML = (100 - pctDone).toFixed(1) + "<small>% LEFT</small>";
  const bar = document.getElementById("barFill");
  bar.style.width = pctDone + "%";
  bar.parentElement.setAttribute("aria-valuenow", Math.round(pctDone));

  const doneUnits = UNITS.filter((u) => watched[u.key]).length;
  document.getElementById("statA").textContent = doneUnits + " / " + UNITS.length + " ticks · " + fmtHours(doneMins) + " banked";
  document.getElementById("statB").textContent = fmtHours(leftMins) + " remaining";

  const daysLeft = Math.max(1, Math.ceil((DEADLINE - new Date()) / 86400000));
  const perDayMins = leftMins / daysLeft;

  const byDay = {};
  UNITS.forEach((u) => {
    const k = watched[u.key];
    if (!k) return;
    if (!byDay[k]) byDay[k] = { mins: 0, titles: [] };
    byDay[k].mins += u.mins;
    byDay[k].titles.push(u.logTitle);
  });
  const dayKeys = Object.keys(byDay).sort().reverse();
  const maxDay = Math.max(1, ...dayKeys.map((k) => byDay[k].mins));
  const todayMins = byDay[todayKey()] ? byDay[todayKey()].mins : 0;

  const paceBox = document.getElementById("paceBox");
  if (leftMins === 0) {
    paceBox.className = "pace done";
    paceBox.innerHTML = '<strong class="green">Marathon complete. Go outside. 🏆</strong>';
  } else {
    paceBox.className = "pace";
    paceBox.innerHTML =
      '<span class="gold">' + fmtHours(perDayMins) + "/day</span> needed over the next <strong>" + daysLeft +
      " days</strong> · today: <strong class=\"" + (todayMins >= perDayMins ? "green" : "") + "\">" +
      fmtHours(todayMins) + "</strong>" + (todayMins >= perDayMins ? " ✓ on pace" : "");
  }

  document.getElementById("logToggle").textContent =
    logOpen ? "Hide watch log ▲" : "Watch log — " + dayKeys.length + " day" + (dayKeys.length === 1 ? "" : "s") + " ▼";
  document.getElementById("logPanel").style.display = logOpen ? "block" : "none";

  const logBody = document.getElementById("logBody");
  if (dayKeys.length === 0) {
    logBody.innerHTML = '<div style="font-size:13px;color:#8b90b0">Nothing logged yet — tick something off and it will appear here with the date.</div>';
  } else {
    logBody.innerHTML = dayKeys.map((k) => {
      const d = byDay[k];
      const ok = d.mins >= perDayMins && leftMins > 0;
      const shown = d.titles.length > 8
        ? d.titles.slice(0, 8).join(" · ") + " · +" + (d.titles.length - 8) + " more"
        : d.titles.join(" · ");
      return '<div class="dayRow"><div class="dayHead"><strong>' + fmtDate(k) + "</strong><span" +
        (ok ? ' class="green"' : "") + ">" + fmtHours(d.mins) + " · " + d.titles.length +
        " tick" + (d.titles.length === 1 ? "" : "s") + "</span></div>" +
        '<div class="dayBarOuter"><div class="dayBarFill' + (ok ? " ok" : "") + '" style="width:' +
        (d.mins / maxDay) * 100 + '%"></div></div>' +
        '<div class="dayTitles">' + shown + "</div></div>";
    }).join("");
  }

  ITEMS.forEach((item) => {
    const li = document.getElementById("item-" + item.id);
    const master = li.querySelector('input[data-item]');
    const meta = li.querySelector(".itemMeta");
    if (item.epStart) {
      const n = epCount(item);
      const done = itemDoneEps(item);
      master.checked = done === n;
      master.indeterminate = done > 0 && done < n;
      li.className = (done === n ? "done" : "") + (openItems.has(item.id) ? " open" : "");
      meta.textContent = done + "/" + n + " eps · " + fmtHours(itemDoneMins(item)) + " of " + fmtHours(item.mins);
      for (let e = item.epStart; e <= item.epEnd; e++) {
        const row = document.getElementById("ep-" + item.id + "-" + e);
        const isDone = !!watched[epKey(item, e)];
        row.className = "epRow" + (isDone ? " epDone" : "");
        row.querySelector("input").checked = isDone;
        row.querySelector(".epWhen").textContent = isDone ? " · " + fmtDate(watched[epKey(item, e)]) : "";
      }
    } else {
      const isDone = !!watched[item.id];
      master.checked = isDone;
      li.className = isDone ? "done" : "";
      meta.textContent = fmtHours(item.mins) + (isDone ? " · watched " + fmtDate(watched[item.id]) : "");
    }
  });
}

document.getElementById("logToggle").addEventListener("click", () => { logOpen = !logOpen; render(); });
document.getElementById("resetBtn").addEventListener("click", () => {
  if (!confirm("Wipe all ticks and the watch log, and start from zero?")) return;
  watched = {};
  persist();
  render();
});

buildList();
render();

</script>
</body>
</html>
