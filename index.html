<style>

  body {

    background: rgba(16,19,34,0.96);
    backdrop-filter: blur(6px);
    border-bottom: 3px solid #e62429;
    padding: calc(env(safe-area-inset-top) + 14px) 16px 14px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  .headrow { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: clamp(22px, 5vw, 34px); }
  h1 .red { color: #e62429; }
  #pctLeft { font-size: clamp(22px, 5vw, 34px); color: #f0b429; }
  #pctLeft small { font-size: 0.55em; }
  .barOuter { margin-top: 10px; height: 18px; border-radius: 4px; overflow: hidden; background: #232742; border: 1px solid #3a3f63; }
  #barFill { height: 100%; width: 0%; background: linear-gradient(90deg, #e62429, #f0b429); transition: width 300ms ease; }
  .stats { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-top: 8px; font-size: 13px; color: #aeb3cf; }
  .pace { margin-top: 10px; padding: 8px 12px; border-radius: 6px; background: #1c2038; border: 1px solid #3a3f63; font-size: 14px; line-height: 1.45; }
  .pace.done { background: #1e3a25; border-color: #3f7a4f; }
  .gold { color: #f0b429; font-weight: 700; }
  .green { color: #7fd98f; }
  button { font-family: inherit; cursor: pointer; }
  .headerBtns { display: flex; gap: 8px; }
  .ghostBtn { margin-top: 8px; width: 100%; background: transparent; color: #aeb3cf; border: 1px solid #3a3f63; border-radius: 6px; padding: 7px 12px; font-size: 13px; }
  #lockBtn { flex: 0 0 auto; width: auto; padding: 7px 14px; }
  #lockBtn.unlocked { color: #f0b429; border-color: #f0b429; }
  main { max-width: 760px; margin: 0 auto; padding: 16px 12px 0; }
  #logPanel { display: none; margin-bottom: 20px; padding: 12px 14px; border-radius: 8px; background: #171a2e; border: 1px solid #2b2f4d; }
  #logPanel h2 { font-size: 18px; letter-spacing: 0.05em; color: #f0b429; margin-bottom: 10px; }
  .dayRow { margin-bottom: 10px; }
  .dayHead { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 3px; }
  .dayBarOuter { height: 8px; border-radius: 3px; background: #232742; overflow: hidden; }
  .dayBarFill { height: 100%; background: linear-gradient(90deg, #e62429, #f0b429); }
  .dayBarFill.ok { background: linear-gradient(90deg, #3f7a4f, #7fd98f); }
  .dayTitles { font-size: 11px; color: #6c7194; margin-top: 2px; }
  ol, ul { list-style: none; }
  .phaseHead {
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    padding: 22px 6px 8px; border-bottom: 2px solid #e62429;
  }
  .phaseHead .pt { font-size: 17px; color: #f0b429; letter-spacing: 0.06em; }
  .phaseHead .pc { font-size: 12px; color: #8b90b0; flex-shrink: 0; }
  .row { display: flex; align-items: center; gap: 12px; padding: 10px; border-bottom: 1px solid #232742; }
  li.done > .row { background: rgba(230,36,41,0.06); opacity: 0.55; }
  li.done > .row .title { text-decoration: line-through; text-decoration-color: #e62429; }
  input[type="checkbox"] { width: 20px; height: 20px; flex-shrink: 0; accent-color: #e62429; cursor: pointer; }
  .num { width: 26px; text-align: right; flex-shrink: 0; color: #4c5178; font-size: 14px; }
  .title { display: block; font-size: 15px; font-weight: 600; }
  .meta { font-size: 12px; color: #8b90b0; }
  .tag { font-weight: 700; letter-spacing: 0.06em; }
  .tag.Film { color: #f0b429; } .tag.TV { color: #7ea6e0; } .tag.Special { color: #c78bdb; }
  .tier { font-weight: 700; letter-spacing: 0.05em; padding: 1px 6px; border-radius: 4px; font-size: 10px; }
  .tierE { color: #f0b429; background: rgba(240,180,41,0.12); border: 1px solid rgba(240,180,41,0.4); }
  .tierR { color: #9fd0ff; background: rgba(126,166,224,0.12); border: 1px solid rgba(126,166,224,0.4); }
  .tierO { color: #8b90b0; background: rgba(139,144,176,0.10); border: 1px solid rgba(139,144,176,0.35); }
  .expandBtn { background: transparent; border: none; color: #7ea6e0; font-size: 18px; padding: 6px 8px; flex-shrink: 0; }
  .removeBtn { background: transparent; border: none; color: #4c5178; font-size: 20px; line-height: 1; padding: 6px 8px; flex-shrink: 0; }
  .removeBtn:hover { color: #e62429; }
  .dragHandle { display: none; flex-shrink: 0; color: #4c5178; font-size: 18px; padding: 6px 4px; cursor: grab; touch-action: none; user-select: none; }
  body.unlocked .dragHandle { display: block; }
  body.unlocked .removeBtn { display: none; }
  li.dragging { opacity: 0.9; }
  li.dragging > .row { background: #232742; outline: 2px solid #f0b429; border-radius: 6px; }
  .epList { display: none; }
  li.open > .epList { display: block; }
  .epRow { display: flex; align-items: center; gap: 10px; padding: 7px 10px 7px 48px; border-bottom: 1px solid #1c2038; font-size: 13px; cursor: pointer; }
  .epRow input { width: 17px; height: 17px; }
  .epRow.epDone { opacity: 0.55; }
  .epRow.epDone .epName { text-decoration: line-through; text-decoration-color: #e62429; }
  .epMeta { color: #8b90b0; font-size: 11px; margin-left: auto; text-align: right; }
  .when { text-decoration: underline dotted; cursor: pointer; }
  .when input[type="date"] { background: #101322; border: 1px solid #3a3f63; color: #f5f2ea; border-radius: 4px; font-size: 12px; padding: 2px 4px; font-family: inherit; }
  #addPanel { display: none; margin-top: 12px; padding: 12px 14px; border-radius: 8px; background: #171a2e; border: 1px solid #2b2f4d; }
  #addPanel label { display: block; font-size: 12px; color: #8b90b0; margin: 8px 0 3px; }
  #addPanel input, #addPanel select { width: 100%; padding: 8px 10px; border-radius: 6px; background: #101322; border: 1px solid #3a3f63; color: #f5f2ea; font-family: inherit; font-size: 14px; }
  .addBtns { display: flex; gap: 8px; margin-top: 12px; }
  .addBtns button { flex: 1; padding: 8px; border-radius: 6px; font-size: 13px; }
  #addSave { background: #e62429; border: none; color: #fff; font-weight: 700; }
  #addCancel { background: transparent; border: 1px solid #3a3f63; color: #8b90b0; }
  #addErr { color: #f08c8c; font-size: 12px; margin-top: 6px; display: none; }
  #removedPanel { display: none; margin-top: 20px; padding: 12px 14px; border-radius: 8px; background: #171a2e; border: 1px solid #2b2f4d; }
  #removedPanel h2 { font-size: 16px; letter-spacing: 0.05em; color: #8b90b0; margin-bottom: 8px; }
  .removedRow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid #1c2038; font-size: 13px; color: #8b90b0; }
  .restoreBtn { background: transparent; color: #7ea6e0; border: 1px solid #3a3f63; border-radius: 5px; padding: 4px 10px; font-size: 12px; flex-shrink: 0; }
  .resetWrap { text-align: center; margin-top: 28px; }
  .resetWrap button { background: transparent; color: #8b90b0; border: 1px solid #3a3f63; border-radius: 6px; padding: 8px 18px; font-size: 13px; }
  @media (prefers-reduced-motion: reduce) { #barFill { transition: none; } }

<body>
<header>
  <div class="wrap">
    <div class="headrow">
      <h1 class="display">Road to <span class="red">Doomsday</span></h1>
      <div id="pctLeft" class="display">100.0<small>% LEFT</small></div>
    </div>
    <div class="barOuter" role="progressbar" aria-label="Marathon progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div id="barFill"></div>
    </div>
    <div class="stats"><span id="statA"></span><span id="statB"></span></div>
    <div class="pace" id="paceBox"></div>
    <div class="headerBtns">
      <button class="ghostBtn" id="logToggle" style="flex:1">Watch log ▼</button>
      <button class="ghostBtn" id="lockBtn" aria-label="Unlock to reorder the list">🔒</button>
    </div>
  </div>
</header>
<main>
  <div id="logPanel"><h2 class="display">Hours per day</h2><div id="logBody"></div></div>
  <ol id="list"></ol>
  <button class="ghostBtn" id="addToggle">＋ Add a film or show</button>
  <div id="addPanel">
    <label for="addTitle">Title</label>
    <input id="addTitle" type="text" placeholder="e.g. Constantine" maxlength="80">
    <label for="addType">Type</label>
    <select id="addType">
      <option value="Film">Film</option>
      <option value="TV">TV (with episodes)</option>
      <option value="Special">Special</option>
    </select>
    <label for="addMins">Total runtime (minutes)</label>
    <input id="addMins" type="number" min="1" max="6000" placeholder="e.g. 121">
    <div id="addEpsWrap" style="display:none">
      <label for="addEps">Number of episodes</label>
      <input id="addEps" type="number" min="1" max="60" placeholder="e.g. 8">
    </div>
    <div id="addErr"></div>
    <div class="addBtns">
      <button id="addSave">Add to marathon</button>
      <button id="addCancel">Cancel</button>
    </div>
  </div>
  <button class="ghostBtn" id="removedToggle" style="display:none"></button>
  <div id="removedPanel"><h2 class="display">Removed from marathon</h2><div id="removedBody"></div></div>
  <div class="resetWrap"><button id="resetBtn">Reset all progress</button></div>
</main>

  "Legacy: 1960s",

const WATCHED_KEY = "mcu-marathon-eps-v3";   // { key: "YYYY-MM-DD" }, key = "id" or "id:ep"
const REMOVED_KEY = "mcu-marathon-removed-v2";
const ORDER_KEY   = "mcu-marathon-order-v2"; // [[id, ph], ...]
const CUSTOM_KEY  = "mcu-marathon-custom-v1";
const DEADLINE = new Date(2026, 11, 18, 23, 59, 59);

// old-list id -> new-list id (chunked AoS/DD/LC seasons collapse onto full seasons; ep numbers carry over)
const MIGRATE = {1:72,2:1,3:3,4:4,5:6,6:37,7:39,8:38,9:42,10:46,11:48,13:48,16:48,12:50,14:49,15:52,17:53,18:54,19:56,20:55,22:55,24:55,21:57,23:58,25:62,27:62,29:62,26:67,28:67,30:67,31:60,32:61,33:61,37:61,34:68,35:64,36:70,38:69,39:77,42:77,43:77,40:75,41:71,44:73,45:100,46:79,47:74,48:97,49:96,51:96,62:96,50:80,52:76,53:93,54:90,55:91,56:92,57:98,58:102,59:103,60:105,61:106,63:117,64:118,65:99,66:111,67:115,68:150,69:149,70:112,71:153,72:124,73:114,74:123,75:120,76:126,77:130,78:122,79:131,80:134,81:136,82:135,83:132,84:133,85:137,86:138,87:139,88:142,89:143,90:147,91:148,92:154,93:156,94:157,95:158,96:164,97:159,98:160,99:161,100:162,101:94,102:95};

let watched = {};
let removed = new Set();
let customs = [];

(function load() {
  try { const c = localStorage.getItem(CUSTOM_KEY); if (c) customs = JSON.parse(c) || []; } catch (e) {}
  customs.forEach((c) => { if (c.ph === undefined) c.ph = 14; ITEMS.push(c); });

  let haveNew = false;
  try {
    const w = localStorage.getItem(WATCHED_KEY);
    if (w) { watched = JSON.parse(w) || {}; haveNew = true; }
  } catch (e) {}
  if (!haveNew) {
    // migrate ticks + dates from the old Digital Spy-order version
    try {
      const oldW = localStorage.getItem("mcu-marathon-eps-v2");
      if (oldW) {
        const o = JSON.parse(oldW) || {};
        Object.keys(o).forEach((k) => {
          const parts = k.split(":");
          const oldId = Number(parts[0]);
          const mapped = MIGRATE[oldId];
          if (mapped !== undefined) {
            watched[parts.length > 1 ? mapped + ":" + parts[1] : String(mapped)] = o[k];
          } else if (oldId >= 1001) {
            watched[k] = o[k]; // custom items keep their ids
          }
        });
        persistWatched();
      }
    } catch (e) {}
    try {
      const oldR = localStorage.getItem("mcu-marathon-removed-v1");
      if (oldR) {
        (JSON.parse(oldR) || []).forEach((oldId) => {
          const mapped = MIGRATE[oldId];
          if (mapped !== undefined) removed.add(mapped);
          else if (oldId >= 1001) removed.add(oldId);
        });
        persistRemoved();
      }
    } catch (e) {}
  } else {
    try { const r = localStorage.getItem(REMOVED_KEY); if (r) removed = new Set(JSON.parse(r)); } catch (e) {}
  }

  try {
    const rawO = localStorage.getItem(ORDER_KEY);
    if (rawO) {
      const saved = JSON.parse(rawO); // [[id, ph], ...]
      const pos = {}, phs = {};
      saved.forEach((pair, i) => { pos[pair[0]] = i; phs[pair[0]] = pair[1]; });
      ITEMS.sort((a, b) => {
        const pa = (pos[a.id] !== undefined) ? pos[a.id] : ITEMS.indexOf(a) - 0.5;
        const pb = (pos[b.id] !== undefined) ? pos[b.id] : ITEMS.indexOf(b) - 0.5;
        return pa - pb;
      });
      ITEMS.forEach((i) => { if (phs[i.id] !== undefined) i.ph = phs[i.id]; });
    }
  } catch (e) {}
})();

function persistWatched() { try { localStorage.setItem(WATCHED_KEY, JSON.stringify(watched)); } catch (e) {} }
function persistRemoved() { try { localStorage.setItem(REMOVED_KEY, JSON.stringify([...removed])); } catch (e) {} }
function persistOrder()   { try { localStorage.setItem(ORDER_KEY, JSON.stringify(ITEMS.map((i) => [i.id, i.ph]))); } catch (e) {} }
function persistCustoms() { try { localStorage.setItem(CUSTOM_KEY, JSON.stringify(customs)); } catch (e) {} }

function epCount(item) { return item.epStart ? (item.epEnd - item.epStart + 1) : 0; }
function epMins(item, ep) {
  const n = epCount(item);
  const base = Math.floor(item.mins / n);
  return (ep === item.epEnd) ? item.mins - base * (n - 1) : base;
}
function epKey(item, ep) { return item.id + ":" + ep; }

let UNITS = [];
function rebuildUnits() {
  UNITS = [];
  ITEMS.forEach((item) => {
    if (item.epStart) {
      for (let e = item.epStart; e <= item.epEnd; e++) {
        UNITS.push({ key: epKey(item, e), mins: epMins(item, e), itemId: item.id, logTitle: item.title + " · Ep " + e });
      }
    } else {
      UNITS.push({ key: String(item.id), mins: item.mins, itemId: item.id, logTitle: item.title });
    }
  });
}
rebuildUnits();

const fmtHours = (mins) => {
  const h = Math.floor(mins / 60);
  const m = Math.round(mins % 60);
  return h + "h " + String(m).padStart(2, "0") + "m";
};
const todayKey = () => {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
};
const fmtDate = (key) => {
  const p = key.split("-").map(Number);
  return new Date(p[0], p[1] - 1, p[2]).toLocaleDateString("en-GB", { day: "numeric", month: "short" });
};

const openItems = new Set();
let logOpen = false;
let removedOpen = false;
let unlocked = false;

function itemDoneEps(item) {
  let c = 0;
  for (let e = item.epStart; e <= item.epEnd; e++) if (watched[epKey(item, e)]) c++;
  return c;
}
function itemDoneMins(item) {
  if (!item.epStart) return watched[item.id] ? item.mins : 0;
  let s = 0;
  for (let e = item.epStart; e <= item.epEnd; e++) if (watched[epKey(item, e)]) s += epMins(item, e);
  return s;
}
function itemComplete(item) {
  return item.epStart ? itemDoneEps(item) === epCount(item) : !!watched[item.id];
}

function buildRows() {
  const ol = document.getElementById("list");
  let html = "";
  let lastPh = -1;
  let headN = 0;
  ITEMS.forEach((item) => {
    if (item.ph !== lastPh) {
      headN++;
      html += '<li class="phaseHead" data-ph="' + item.ph + '" id="phase-' + headN + '">' +
              '<span class="pt display">' + (PHASES[item.ph] || "Custom") + '</span>' +
              '<span class="pc"></span></li>';
      lastPh = item.ph;
    }
    let inner =
      '<div class="row">' +
      '<span class="dragHandle" data-drag="' + item.id + '" aria-hidden="true">≡</span>' +
      '<input type="checkbox" data-item="' + item.id + '" aria-label="Mark all of ' + item.title.replace(/"/g, "") + '">' +
      '<span class="num display"></span>' +
      '<span style="flex:1;min-width:0" data-open="' + item.id + '">' +
      '<span class="title">' + item.title + '</span>' +
      '<span class="meta"><span class="tag ' + item.type + '">' + item.type.toUpperCase() + '</span>' +
      (item.tier ? ' <span class="tier tier' + item.tier + '">' +
        (item.tier === "E" ? "★ ESSENTIAL" : item.tier === "R" ? "✦ RECOMMENDED" : "○ OPTIONAL") + '</span>' : '') +
      ' · <span class="itemMeta"></span></span>' +
      '</span>';
    if (item.epStart) {
      inner += '<button class="expandBtn" data-open="' + item.id + '" aria-label="Show episodes">▾</button>';
    }
    inner += '<button class="removeBtn" data-remove="' + item.id + '" aria-label="Remove from marathon">×</button>';
    inner += '</div>';
    if (item.epStart) {
      let eps = "";
      for (let e = item.epStart; e <= item.epEnd; e++) {
        eps += '<li><label class="epRow" id="ep-' + item.id + '-' + e + '">' +
          '<input type="checkbox" data-ep="' + epKey(item, e) + '">' +
          '<span class="epName">Ep ' + e + '</span>' +
          '<span class="epMeta"><span class="epTime">' + fmtHours(epMins(item, e)) + '</span><span class="epWhen green"></span></span>' +
          '</label></li>';
      }
      inner += '<ul class="epList">' + eps + '</ul>';
    }
    html += '<li id="item-' + item.id + '" data-row="item">' + inner + '</li>';
  });
  ol.innerHTML = html;
}

function render() {
  const active = UNITS.filter((u) => !removed.has(u.itemId));
  const activeTotal = active.reduce((s, u) => s + u.mins, 0) || 1;
  const doneMins = active.reduce((s, u) => s + (watched[u.key] ? u.mins : 0), 0);
  const leftMins = activeTotal - doneMins;
  const pctDone = (doneMins / activeTotal) * 100;

  document.getElementById("pctLeft").innerHTML = (100 - pctDone).toFixed(1) + "<small>% LEFT</small>";
  const bar = document.getElementById("barFill");
  bar.style.width = pctDone + "%";
  bar.parentElement.setAttribute("aria-valuenow", Math.round(pctDone));

  const doneUnits = active.filter((u) => watched[u.key]).length;
  document.getElementById("statA").textContent = doneUnits + " / " + active.length + " ticks · " + fmtHours(doneMins) + " banked";
  document.getElementById("statB").textContent = fmtHours(leftMins) + " remaining";

  const daysLeft = Math.max(1, Math.ceil((DEADLINE - new Date()) / 86400000));
  const perDayMins = leftMins / daysLeft;

  const byDay = {};
  active.forEach((u) => {
    const k = watched[u.key];
    if (!k) return;
    if (!byDay[k]) byDay[k] = { mins: 0, titles: [] };
    byDay[k].mins += u.mins;
    byDay[k].titles.push(u.logTitle);
  });
  const dayKeys = Object.keys(byDay).sort().reverse();
  const maxDay = Math.max(1, ...dayKeys.map((k) => byDay[k].mins));
  const todayMins = byDay[todayKey()] ? byDay[todayKey()].mins : 0;

  const paceBox = document.getElementById("paceBox");
  if (leftMins === 0) {
    paceBox.className = "pace done";
    paceBox.innerHTML = '<strong class="green">Marathon complete. Go outside. 🏆</strong>';
  } else {
    paceBox.className = "pace";
    paceBox.innerHTML =
      '<span class="gold">' + fmtHours(perDayMins) + '/day</span> needed over the next <strong>' + daysLeft +
      ' days</strong> · today: <strong class="' + (todayMins >= perDayMins ? 'green' : '') + '">' +
      fmtHours(todayMins) + '</strong>' + (todayMins >= perDayMins ? ' ✓ on pace' : '');
  }

  document.getElementById("logToggle").textContent =
    logOpen ? "Hide watch log ▲" : "Watch log — " + dayKeys.length + " day" + (dayKeys.length === 1 ? "" : "s") + " ▼";
  document.getElementById("logPanel").style.display = logOpen ? "block" : "none";

  const logBody = document.getElementById("logBody");
  if (dayKeys.length === 0) {
    logBody.innerHTML = '<div style="font-size:13px;color:#8b90b0">Nothing logged yet — tick something off and it will appear here with the date.</div>';
  } else {
    logBody.innerHTML = dayKeys.map((k) => {
      const d = byDay[k];
      const ok = d.mins >= perDayMins && leftMins > 0;
      const shown = d.titles.length > 8
        ? d.titles.slice(0, 8).join(" · ") + " · +" + (d.titles.length - 8) + " more"
        : d.titles.join(" · ");
      return '<div class="dayRow"><div class="dayHead"><strong>' + fmtDate(k) + '</strong><span' +
        (ok ? ' class="green"' : '') + '>' + fmtHours(d.mins) + ' · ' + d.titles.length +
        ' tick' + (d.titles.length === 1 ? '' : 's') + '</span></div>' +
        '<div class="dayBarOuter"><div class="dayBarFill' + (ok ? ' ok' : '') + '" style="width:' +
        (d.mins / maxDay) * 100 + '%"></div></div>' +
        '<div class="dayTitles">' + shown + '</div></div>';
    }).join("");
  }

  // removed panel
  const removedItems = ITEMS.filter((i) => removed.has(i.id));
  const removedToggle = document.getElementById("removedToggle");
  if (removedItems.length === 0) {
    removedToggle.style.display = "none";
    removedOpen = false;
  } else {
    removedToggle.style.display = "block";
    removedToggle.textContent = removedOpen ? "Hide removed ▲" : "Removed from marathon — " + removedItems.length + " ▼";
  }
  document.getElementById("removedPanel").style.display = removedOpen && removedItems.length ? "block" : "none";
  document.getElementById("removedBody").innerHTML = removedItems.map((i) =>
    '<div class="removedRow"><span>' + i.title + ' · ' + fmtHours(i.mins) +
    '</span><span style="display:flex;gap:6px"><button class="restoreBtn" data-restore="' + i.id + '">Restore</button>' +
    (i.id >= 1001 ? '<button class="restoreBtn" style="color:#f08c8c;border-color:#5a3a3a" data-delete-custom="' + i.id + '">Delete</button>' : '') +
    '</span></div>'
  ).join("");

  // renumber + per-item state + phase counts
  const listEl = document.getElementById("list");
  let n = 0;
  let curHead = null, phDone = 0, phTotal = 0;
  const flushHead = () => {
    if (curHead) curHead.querySelector(".pc").textContent = phDone + " / " + phTotal + " titles";
  };
  Array.from(listEl.children).forEach((li) => {
    if (li.classList.contains("phaseHead")) {
      flushHead();
      curHead = li; phDone = 0; phTotal = 0;
      return;
    }
    const id = Number(li.id.replace("item-", ""));
    const item = ITEMS.find((i) => i.id === id);
    if (!item) return;
    const isRemoved = removed.has(id);
    li.style.display = isRemoved ? "none" : "";
    if (!isRemoved) {
      n++;
      li.querySelector(".num").textContent = n;
      phTotal++;
      if (itemComplete(item)) phDone++;
    }
    const master = li.querySelector('input[data-item]');
    const meta = li.querySelector(".itemMeta");
    if (item.epStart) {
      const cnt = epCount(item), done = itemDoneEps(item);
      master.checked = done === cnt;
      master.indeterminate = done > 0 && done < cnt;
      li.classList.toggle("done", done === cnt);
      li.classList.toggle("open", openItems.has(item.id));
      meta.textContent = done + "/" + cnt + " eps · " + fmtHours(itemDoneMins(item)) + " of " + fmtHours(item.mins);
      for (let e = item.epStart; e <= item.epEnd; e++) {
        const row = document.getElementById("ep-" + item.id + "-" + e);
        const isDone = !!watched[epKey(item, e)];
        row.className = "epRow" + (isDone ? " epDone" : "");
        row.querySelector("input").checked = isDone;
        row.querySelector(".epWhen").innerHTML = isDone
          ? ' · <span class="when" data-datekey="' + epKey(item, e) + '">' + fmtDate(watched[epKey(item, e)]) + ' ✎</span>'
          : "";
      }
    } else {
      const isDone = !!watched[item.id];
      master.checked = isDone;
      li.classList.toggle("done", isDone);
      meta.innerHTML = fmtHours(item.mins) + (isDone
        ? ' · <span class="when green" data-datekey="' + item.id + '">watched ' + fmtDate(watched[item.id]) + ' ✎</span>'
        : "");
    }
  });
  flushHead();
}

function attachListeners() {
  const ol = document.getElementById("list");

  ol.addEventListener("change", (e) => {
    const epK = e.target.getAttribute("data-ep");
    const itemId = e.target.getAttribute("data-item");
    if (epK) {
      if (watched[epK]) delete watched[epK];
      else watched[epK] = todayKey();
    } else if (itemId) {
      const item = ITEMS.find((i) => String(i.id) === itemId);
      if (item.epStart) {
        const allDone = itemDoneEps(item) === epCount(item);
        for (let ep = item.epStart; ep <= item.epEnd; ep++) {
          const k = epKey(item, ep);
          if (allDone) delete watched[k];
          else if (!watched[k]) watched[k] = todayKey();
        }
      } else {
        if (watched[itemId]) delete watched[itemId];
        else watched[itemId] = todayKey();
      }
    } else return;
    persistWatched();
    render();
  });

  function openDateEditor(span) {
    if (span.querySelector("input")) return;
    const key = span.getAttribute("data-datekey");
    const cur = watched[key] || todayKey();
    span.innerHTML = "";
    const inp = document.createElement("input");
    inp.type = "date";
    inp.value = cur;
    inp.max = todayKey();
    span.appendChild(inp);
    inp.focus();
    let saved = false;
    inp.addEventListener("change", () => {
      if (inp.value && inp.value <= todayKey()) {
        watched[key] = inp.value;
        persistWatched();
      }
      saved = true;
      render();
    });
    inp.addEventListener("blur", () => { if (!saved) render(); });
  }

  ol.addEventListener("click", (e) => {
    const dk = e.target.closest("[data-datekey]");
    if (dk) {
      if (e.target.tagName === "INPUT") { e.stopPropagation(); return; } // let the native date picker open
      e.preventDefault();
      e.stopPropagation();
      openDateEditor(dk);
      return;
    }
    const rm = e.target.closest("[data-remove]");
    if (rm) {
      e.preventDefault();
      removed.add(Number(rm.getAttribute("data-remove")));
      persistRemoved();
      render();
      return;
    }
    const t = e.target.closest("[data-open]");
    if (!t || e.target.tagName === "INPUT") return;
    const id = Number(t.getAttribute("data-open"));
    const item = ITEMS.find((i) => i.id === id);
    if (!item || !item.epStart) return;
    e.preventDefault();
    if (openItems.has(id)) openItems.delete(id); else openItems.add(id);
    render();
  });

  // drag to reorder
  let dragLi = null;
  let scrollTimer = null;
  function autoScroll(y) {
    const edge = 110;
    let dy = 0;
    if (y < edge) dy = -12;
    else if (y > window.innerHeight - edge) dy = 12;
    if (dy !== 0 && scrollTimer === null) scrollTimer = setInterval(() => window.scrollBy(0, dy), 16);
    else if (dy === 0 && scrollTimer !== null) { clearInterval(scrollTimer); scrollTimer = null; }
  }
  ol.addEventListener("pointerdown", (e) => {
    if (!unlocked) return;
    const handle = e.target.closest(".dragHandle");
    if (!handle) return;
    e.preventDefault();
    dragLi = handle.closest("li");
    dragLi.classList.add("dragging");
    handle.setPointerCapture(e.pointerId);
  });
  ol.addEventListener("pointermove", (e) => {
    if (!dragLi) return;
    e.preventDefault();
    autoScroll(e.clientY);
    const rows = Array.from(ol.children).filter(
      (li) => li !== dragLi && li.style.display !== "none"
    );
    for (const sib of rows) {
      const r = sib.getBoundingClientRect();
      if (e.clientY < r.top + r.height / 2) {
        if (sib.previousElementSibling !== dragLi) ol.insertBefore(dragLi, sib);
        return;
      }
    }
    if (ol.lastElementChild !== dragLi) ol.appendChild(dragLi);
  });
  function endDrag() {
    if (!dragLi) return;
    dragLi.classList.remove("dragging");
    const draggedId = Number(dragLi.id.replace("item-", ""));
    dragLi = null;
    if (scrollTimer !== null) { clearInterval(scrollTimer); scrollTimer = null; }
    // dragged item adopts the phase it now sits under
    let curPh = ITEMS.length ? ITEMS[0].ph : 0;
    const byId = {};
    ITEMS.forEach((i) => { byId[i.id] = i; });
    const newOrder = [];
    Array.from(ol.children).forEach((li) => {
      if (li.classList.contains("phaseHead")) { curPh = Number(li.getAttribute("data-ph")); return; }
      const it = byId[Number(li.id.replace("item-", ""))];
      if (!it) return;
      if (it.id === draggedId) it.ph = curPh;
      newOrder.push(it);
    });
    ITEMS.length = 0;
    newOrder.forEach((i) => ITEMS.push(i));
    persistOrder();
    rebuildUnits();
    buildRows();
    render();
  }
  ol.addEventListener("pointerup", endDrag);
  ol.addEventListener("pointercancel", endDrag);
}

// lock
const lockBtn = document.getElementById("lockBtn");
lockBtn.addEventListener("click", () => {
  unlocked = !unlocked;
  document.body.classList.toggle("unlocked", unlocked);
  lockBtn.classList.toggle("unlocked", unlocked);
  lockBtn.textContent = unlocked ? "🔓" : "🔒";
  if (!unlocked) persistOrder();
});

// add custom
const addPanel = document.getElementById("addPanel");
document.getElementById("addToggle").addEventListener("click", () => {
  addPanel.style.display = addPanel.style.display === "block" ? "none" : "block";
});
document.getElementById("addType").addEventListener("change", (e) => {
  document.getElementById("addEpsWrap").style.display = e.target.value === "TV" ? "block" : "none";
});
document.getElementById("addCancel").addEventListener("click", () => { addPanel.style.display = "none"; });
document.getElementById("addSave").addEventListener("click", () => {
  const title = document.getElementById("addTitle").value.trim();
  const type = document.getElementById("addType").value;
  const mins = parseInt(document.getElementById("addMins").value, 10);
  const eps = parseInt(document.getElementById("addEps").value, 10);
  const err = document.getElementById("addErr");
  const fail = (m) => { err.textContent = m; err.style.display = "block"; };
  err.style.display = "none";
  if (!title) return fail("Give it a title.");
  if (!mins || mins < 1) return fail("Enter the total runtime in minutes.");
  if (type === "TV" && (!eps || eps < 1)) return fail("Enter how many episodes it has.");
  const safe = title.replace(/</g, "‹").replace(/>/g, "›").replace(/"/g, "″");
  const id = Math.max(1000, ...customs.map((c) => c.id)) + 1;
  const item = { id: id, title: safe, type: type, mins: mins, ph: ITEMS.length ? ITEMS[ITEMS.length - 1].ph : 14 };
  if (type === "TV") { item.epStart = 1; item.epEnd = eps; }
  customs.push(item);
  ITEMS.push(item);
  persistCustoms(); persistOrder();
  rebuildUnits(); buildRows(); render();
  document.getElementById("addTitle").value = "";
  document.getElementById("addMins").value = "";
  document.getElementById("addEps").value = "";
  addPanel.style.display = "none";
  const el = document.getElementById("item-" + id);
  if (el) el.scrollIntoView({ block: "center" });
});

// removed panel
document.getElementById("removedToggle").addEventListener("click", () => { removedOpen = !removedOpen; render(); });
document.getElementById("removedPanel").addEventListener("click", (e) => {
  const del = e.target.closest("[data-delete-custom]");
  if (del) {
    const id = Number(del.getAttribute("data-delete-custom"));
    if (!confirm("Delete this custom entry for good?")) return;
    customs = customs.filter((c) => c.id !== id);
    const ix = ITEMS.findIndex((i) => i.id === id);
    if (ix >= 0) ITEMS.splice(ix, 1);
    removed.delete(id);
    Object.keys(watched).forEach((k) => { if (k === String(id) || k.indexOf(id + ":") === 0) delete watched[k]; });
    persistCustoms(); persistRemoved(); persistWatched(); persistOrder();
    rebuildUnits(); buildRows(); render();
    return;
  }
  const b = e.target.closest("[data-restore]");
  if (!b) return;
  removed.delete(Number(b.getAttribute("data-restore")));
  persistRemoved();
  render();
});

// log + reset
document.getElementById("logToggle").addEventListener("click", () => { logOpen = !logOpen; render(); });
document.getElementById("resetBtn").addEventListener("click", () => {
  if (!confirm("Wipe all ticks, dates, removals, custom entries and ordering, and start from zero?")) return;
  try {
    [WATCHED_KEY, REMOVED_KEY, ORDER_KEY, CUSTOM_KEY,
     "mcu-marathon-eps-v2", "mcu-marathon-removed-v1", "mcu-marathon-order-v1", "mcu-marathon-log-v1"
    ].forEach((k) => localStorage.removeItem(k));
  } catch (e) {}
  location.reload();
});

buildRows();
attachListeners();
render();
</script>
</body>
